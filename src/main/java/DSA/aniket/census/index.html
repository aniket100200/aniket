<script>
    function downloadImage() {
        // Select the SVG element
        const svg = document.getElementById("village-map-svg");

        // Serialize the SVG to a string
        const serializer = new XMLSerializer();
        let svgString = serializer.serializeToString(svg);

        // Create an image object and a canvas
        const img = new Image();
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // Convert SVG to a blob and create a URL
        const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function () {
            // Set canvas size equal to SVG size
            canvas.width = img.width;
            canvas.height = img.height;

            // Optional: fill background with white (since SVG default is transparent)
            ctx.fillStyle = "#fafafa";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the SVG image onto the canvas
            ctx.drawImage(img, 0, 0);

            // Clean up the URL
            URL.revokeObjectURL(url);

            // Convert canvas to a PNG Data URI
            const imgURI = canvas.toDataURL("image/png");

            // Create a fake anchor tag to trigger the download
            const a = document.createElement("a");
            a.href = imgURI;
            a.download = "Village_Map_Layout.png";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // Trigger the image load
        img.src = url;
    }
</script>
